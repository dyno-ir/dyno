# Build dyno, run its C++ tests, and run the dyno-sv benchmark tests in one job.
name: CMake build, test, benchmarks

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  BUILD_TYPE: Release
  LLVM_VER: 22
  # Configure ccache environment variables
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Install Clang ${{ env.LLVM_VER }}, libc++, ccache, and benchmark tools
      run: |
        # Download the official LLVM repo setup script
        wget https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        # Install Clang, then manually install the matching libc++ headers and ccache
        sudo ./llvm.sh ${{ env.LLVM_VER }}
        sudo apt-get install -y libc++-${{ env.LLVM_VER }}-dev libc++abi-${{ env.LLVM_VER }}-dev ccache yosys binutils-riscv64-unknown-elf gcc-riscv64-unknown-elf device-tree-compiler
        sudo ln -sf /usr/bin/riscv64-unknown-elf-as /usr/local/bin/riscv32-elf-as
        sudo ln -sf /usr/bin/riscv64-unknown-elf-gcc /usr/local/bin/riscv32-elf-gcc
        sudo ln -sf /usr/bin/riscv64-unknown-elf-objcopy /usr/local/bin/riscv32-elf-objcopy
        printf '#!/bin/sh\nexec /usr/bin/riscv64-unknown-elf-ld -m elf32lriscv "$@"\n' | sudo tee /usr/local/bin/riscv32-elf-ld >/dev/null
        sudo chmod +x /usr/local/bin/riscv32-elf-ld

    - name: Restore ccache
      uses: actions/cache/restore@v4
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ccache-${{ runner.os }}-${{ github.run_id }}
        restore-keys: |
          ccache-${{ runner.os }}-

    - name: Configure ccache
      run: |
        mkdir -p ${{ env.CCACHE_DIR }}
        ccache --set-config=max_size=1G
        ccache -z

    - name: Clone dependencies
      run: |
        git config --file .gitmodules --get-regexp 'submodule\..*\.path' | while read -r key path; do
          name=${key#submodule.}
          name=${name%.path}
          url=$(git config --file .gitmodules --get "submodule.$name.url")
          hash=$(git ls-tree HEAD "$path" | awk '{print $3}')
          rm -rf "$path"
          git clone "$url" "$path"
          git -C "$path" checkout "$hash"
          git -C "$path" submodule update --init --recursive
        done

    - name: Configure CMake
      env:
        CC: clang-${{ env.LLVM_VER }}
        CXX: clang++-${{ env.LLVM_VER }}
        CXXFLAGS: -stdlib=libc++
        LDFLAGS: -stdlib=libc++
      run: >
        cmake -B ${{github.workspace}}/build
        -DCMAKE_C_COMPILER=clang-${{ env.LLVM_VER }}
        -DCMAKE_CXX_COMPILER=clang++-${{ env.LLVM_VER }}
        -DCMAKE_CXX_FLAGS="-stdlib=libc++"
        -DCMAKE_EXE_LINKER_FLAGS="-stdlib=libc++"
        -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}
        -DCMAKE_C_COMPILER_LAUNCHER=ccache
        -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} -j $(nproc)

    - name: Save ccache
      uses: actions/cache/save@v4
      if: always()
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ccache-${{ runner.os }}-${{ github.run_id }}

    - name: Show ccache stats
      if: always()
      run: ccache -s

    - name: Test
      env:
        CXX: clang++-${{ env.LLVM_VER }}
        CXXFLAGS: -stdlib=libc++
        LDFLAGS: -stdlib=libc++
      working-directory: ${{github.workspace}}/build
      run: ctest -C ${{env.BUILD_TYPE}} --output-on-failure

    - name: Upload test artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-artifacts
        path: |
          ${{github.workspace}}/build/bench_*.json
          ${{github.workspace}}/build/Testing/Temporary/LastTest.log
